name: kit

on:
  push:
    branches: [main]
    tags: ["kit-v*"]
  pull_request:
    paths:
      - "packages/kit/**"
      - "apps/reference/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/kit.yml"

permissions:
  contents: read

concurrency:
  group: kit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm --filter @divelog/kit test:coverage
      - name: Build
        run: pnpm build
      - name: Generated files are current
        run: pnpm --filter @divelog/kit og-fonts:check
      - name: Install Playwright Chromium
        run: pnpm --filter reference exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/reference/test-results
          retention-days: 7
