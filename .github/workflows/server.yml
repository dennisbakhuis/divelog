name: server

on:
  push:
    branches: [main]
    tags: ["server-v*"]
  pull_request:
    paths:
      - "packages/server/**"
      - "schema/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy divelog_server
      - name: Pytest
        run: uv run pytest -q
      - name: Image pins match uv.lock
        run: |
          uv export --package divelog-server --frozen --no-dev --no-emit-workspace --no-header \
            -o /tmp/requirements.lock
          uv export --package divelog-server --frozen --no-emit-workspace --no-header \
            -o /tmp/requirements-dev.lock
          diff -u requirements.lock /tmp/requirements.lock
          diff -u requirements-dev.lock /tmp/requirements-dev.lock

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            echo "app=${GITHUB_REF#refs/tags/server-v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${OWNER,,}/divelog-server" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Log in to GHCR
        if: steps.version.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on server-v* tags)
        uses: docker/build-push-action@v6
        with:
          context: packages/server
          target: runtime
          build-args: APP_VERSION=${{ steps.version.outputs.app }}
          push: ${{ steps.version.outputs.push == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.app }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
