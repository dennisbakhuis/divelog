[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divelog-server"
version = "0.6.1"
description = "Dive log server: a FastAPI API over a git repository of markdown and JSON files, with the divelog CLI"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.18",
  "aiosmtplib>=3.0",
  "boto3>=1.36",
  "pillow>=11.0",
  "python-json-logger>=3.0",
  "lxml>=5.3",
  "markdown-it-py>=4.2.0",
  "nh3>=0.3.7",
  "rapidfuzz>=3.14.6",
  "pillow-heif>=1.0",
]

[project.scripts]
divelog = "divelog_server.cli:main"
divelog-server = "divelog_server.__main__:main"

[dependency-groups]
dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "types-pyyaml>=6.0",
  "boto3-stubs[s3]>=1.36",
  "lxml-stubs>=0.5",
  "types-boto3>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["divelog_server"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"divelog_server/api/v1/*.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "aiosmtplib", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["divelog_server.schemas.*"]
disable_error_code = ["prop-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
